resource:
    name: ServicePoints
    shortName: service-points
    description: 'Service points exposed as a relationship target for `checkout-data`. Populated through `Spryker\Glue\CheckoutRestApi\Api\Storefront\Relationship\CheckoutDataServicePointsRelationshipResolver`; the legacy `ServicePointsResourceRoutePlugin` keeps serving `GET /service-points` directly.'

    properties:
        uuid:
            type: string
            identifier: true
            readable: true
            writable: false
            description: 'Service point UUID.'
            openapiContext:
                example: '3fec586e-92f6-5692-a98b-dfca29cd2e16'

        name:
            type: string
            readable: true
            writable: false
            description: 'Service point name.'
            openapiContext:
                example: 'Main Service Point'

        key:
            type: string
            readable: true
            writable: false
            description: 'Service point key.'
            openapiContext:
                example: 'main-service-point'
