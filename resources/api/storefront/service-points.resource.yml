resource:
    name: ServicePoints
    shortName: service-points
    description: Service points API for Storefront operations

    provider: Spryker\Glue\ServicePointsRestApi\Api\Storefront\Provider\ServicePointsStorefrontProvider

    operations:
        - type: Get
          openapiContext:
              responses:
                  200:
                      description: 'Service point returned.'
                  404:
                      description: 'Service point not found.'

        - type: GetCollection
          paginationItemsPerPage: 10
          openapiContext:
              parameters:
                  - name: 'q'
                    in: query
                    required: false
                    description: 'Full-text search over service point names and addresses.'
                    schema:
                        type: string
                    example: 'Berlin'
                  - name: 'filter[service-points.serviceTypeKey]'
                    in: query
                    required: false
                    description: 'Return only service points that offer the service type with this key.'
                    schema:
                        type: string
                    example: 'pickup'
                  - name: 'sort'
                    in: query
                    required: false
                    description: 'Sort field, prefixed with `-` for descending order. Unsupported fields are ignored.'
                    schema:
                        type: string
                        enum: ['city', '-city']
                    example: 'city'
              responses:
                  200:
                      description: 'Service point collection returned.'

    includes:
        - relationshipName: service-point-addresses
          targetResource: ServicePointAddresses
          uriTemplate: '/service-points/{servicePointUuid}/service-point-addresses/{uuid}'
          uriVariableMappings:
              uuid: servicePointUuid
              servicePointAddressUuid: uuid

    properties:
        uuid:
            type: string
            identifier: true
            readable: true
            writable: false
            description: 'Service point UUID.'
            openapiContext:
                example: '3fec586e-92f6-5692-a98b-dfca29cd2e16'

        name:
            type: string
            readable: true
            writable: false
            description: 'Service point name.'
            openapiContext:
                example: 'Main Service Point'

        key:
            type: string
            readable: true
            writable: false
            description: 'Service point key.'
            openapiContext:
                example: 'main-service-point'

        servicePointAddressUuid:
            type: string
            readable: false
            writable: false
            description: 'Internal mapping for the service-point-addresses relationship.'
            openapiContext:
                example: '8a14ba51-3fd1-5b35-9b75-f7d1bf09c0c8'

        pagination:
            type: array
            readable: true
            writable: false
            description: 'Pagination metadata for the collection. Populated only on the first item of a GET /service-points response and consumed by PaginationLinksResponseSubscriber to emit JSON:API top-level pagination links.'
